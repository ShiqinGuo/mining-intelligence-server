[project]
name = "mining-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["mining-backend", "mining-gateway", "pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend", "apps/mcp_gateway", "packages/contracts"]

[tool.uv.sources]
mining-backend = { workspace = true }
mining-gateway = { workspace = true }
mining-contracts = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/backend/tests", "apps/mcp_gateway/tests", "tests/integration"]
pythonpath = [".", "apps/backend"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
