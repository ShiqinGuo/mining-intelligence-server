[project]
name = "mining-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn[standard]>=0.41,<1", "pydantic>=2.12,<3",
  "pydantic-settings>=2.13,<3", "sqlalchemy[asyncio]>=2.0.48,<2.1", "asyncpg>=0.31,<1",
  "alembic>=1.18,<2", "celery==5.6.3", "httpx>=0.28,<1", "beautifulsoup4>=4.14,<5",
  "mcp==2.3.0", "python-multipart>=0.0.22,<1", "pymupdf>=1.26,<1.27", "cryptography>=46,<49", "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mining_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
