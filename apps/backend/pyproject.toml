[project]
name = "mining-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mining-contracts", "fastapi>=0.135,<1", "uvicorn[standard]>=0.41,<1",
  "pydantic-settings>=2.13,<3", "sqlalchemy[asyncio]>=2.0.48,<2.1", "asyncpg>=0.31,<1",
  "alembic>=1.18,<2", "celery==5.6.3", "httpx>=0.28,<1", "beautifulsoup4>=4.14,<5",
  "python-multipart>=0.0.22,<1", "pymupdf>=1.26,<1.27", "cryptography>=46,<49", "pyjwt[crypto]>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mining_server"]

[tool.ruff]
extend = "../../pyproject.toml"
